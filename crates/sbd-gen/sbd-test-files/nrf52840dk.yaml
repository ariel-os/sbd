version: 0.5.0
description: test sbd file
targets:
  nrf52840dk:
    chip: nrf52840
    flags:
      - has_usb_device_port
    leds:
      - pin: P0_13
        color: green
        active: low
      - pin: P0_14
        color: green
        active: low
      - pin: P0_15
        color: green
      - pin: P0_16
        color: green

    switches:
      - pins: P0_11
        resistors: pullup
        active: low
      - pins: P0_12
        resistors: none
        active: low
      - pins: P0_24
        resistors: none
        active: low
      - pins: P0_25
        resistors: none
        active: low
