version: 0.5.0
description: test sbd file
targets:
  nrf52840dk:
    chip: nrf52840
    flags:
      - has_usb_device_port
    leds:
      - pin: P0_13
        color: green
        active: low
      - pin: P0_14
        color: green
        active: low
      - pin: P0_15
        color: green
        active: low
      - pin: P0_16
        color: green
        active: low

    buttons:
      # button0
      - pin: P0_11
        resistor: pullup
        active: low
      # button1
      - pin: P0_12
        resistor: none
        active: low
      # button2
      - pin: P0_24
        resistor: none
        active: low
      # button3
      - pin: P0_25
        resistor: none
        active: low

    spi:
      - aliases: [spi0]
        miso: P0_28
        mosi: P0_29
        sck: P0_27
        devices:
          - type: dummy
            aliases: [device0]
            cs: P0_30
            drdy: P0_03
          - type: dummy
            aliases: [device1]
            cs: P0_31
