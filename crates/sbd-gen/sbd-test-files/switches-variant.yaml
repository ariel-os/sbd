version: 0.5.0
targets:
  many-switches:
    chip: stm32u083mc
    switches:
      # Push Button
      - pins: P01
        resistors: pullup
        active: low
      # SPST toggle switch
      - pins: P07
        resistors: none
        active: high
      # Single jumper with two positions.
      - pins:
          - P02
          - P03
        active:
          - high
          - low
        resistors:
          - pulldown
          - none
        aliases:
          - JP1
      # 3 Row DIP switch.
      - pins:
          - P04
          - P05
          - P06
        resistors:
          - pullup
          - pulldown
          - none
        active:
          - low
          - high
          - high
